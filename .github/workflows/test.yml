name: Tests
on: [push, pull_request]
jobs:
    linux:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - name: Install Neovim 0.12
              run: |
                  curl -fsSL https://github.com/neovim/neovim/releases/download/v0.12.6/nvim-linux-x86_64.tar.gz | tar xz -C "$RUNNER_TEMP"
                  echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
            - name: Offline tests (fake agents, no inference)
              run: make test
    windows:
        runs-on: windows-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - name: Install Neovim 0.12
              shell: pwsh
              run: |
                  Invoke-WebRequest https://github.com/neovim/neovim/releases/download/v0.12.6/nvim-win64.zip -OutFile "$env:RUNNER_TEMP\nvim.zip"
                  Expand-Archive "$env:RUNNER_TEMP\nvim.zip" -DestinationPath $env:RUNNER_TEMP
                  Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\nvim-win64\bin"
            - name: Offline tests (fake agents, no inference)
              run: nvim --clean --headless -l tests/run.lua
